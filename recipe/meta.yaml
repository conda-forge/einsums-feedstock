{% set version = "2.0.0a1" %}
{% set stripes_version = "1.0.0" %}
{% set waggle_version = "1.0.1" %}
{% set build_number = 0 %}

package:
  name: einsums-split
  version: {{ version }}

source:
  - url: https://github.com/Einsums/Einsums/archive/v{{ version }}.tar.gz
    sha256: 96715489bf67394480af9dbb4af3309a1cac498a1d1bea9ca5c23a6a1b4cad34
    # All are fixed in Einsums after 2.0.0a1; drop them with the next version.
    patches:
      - 0001-include-omp.h-only-where-it-is-used.patch
      - 0002-check-only-that-mps-reports-device-memory.patch
      - 0003-check-scratch-privatization-against-double-precision-oracles.patch
      - 0004-register-the-backend-less-stage-the-select-default-test-checks-for.patch
  # Stripes and Waggle began as Einsums modules and are released on their own; this feedstock
  # ships them as einsums-stripes and einsums-waggle until they have feedstocks of their own.
  - url: https://github.com/Einsums/Stripes/archive/v{{ stripes_version }}.tar.gz
    sha256: 2e9eee12ecaeeeed3e93bca5a547e2af89fedfa93d80df9ef4823ca81538b6e2
    folder: stripes-src
  - url: https://github.com/Einsums/Waggle/archive/v{{ waggle_version }}.tar.gz
    sha256: 119cd104034ca06fd10438af65015c8ee7512c151cf584f65bf9a763acdf258f
    folder: waggle-src

build:
  number: {{ build_number }}
  skip: true  # [win]

outputs:
  - name: einsums-stripes
    version: {{ stripes_version }}
    script: build-stripes.sh
    build:
      # The runtime library's soname and the package config both follow the major version.
      run_exports:
        - {{ pin_subpackage('einsums-stripes', max_pin='x') }}

    requirements:
      build:
        - {{ stdlib("c") }}
        - {{ compiler("cxx") }}
        - cmake >=3.27
        - ninja

    test:
      requires:
        - {{ compiler("cxx") }}
        - {{ stdlib("c") }}
        - cmake >=3.27
        - ninja
      files:
        - find-package/
      commands:
        - test -f $PREFIX/lib/libstripes$SHLIB_EXT
        - test -f $PREFIX/include/Stripes/Vec.hpp
        - test -f $PREFIX/lib/cmake/Stripes/StripesConfig.cmake
        # stripes_add_dispatch_sources(), which Einsums builds its kernels with
        - test -f $PREFIX/lib/cmake/Stripes/StripesDispatch.cmake
        - cmake -S find-package -B find-stripes -G Ninja ${CMAKE_ARGS} -D CMAKE_PREFIX_PATH=$PREFIX -D PACKAGE=Stripes -D VERSION={{ stripes_version }} -D TARGET=Stripes::stripes

  # The C++ profiler and, for now, its Python package (waggle, waggle._core and the waggle command).
  # waggle._core is built per Python, which makes this output per Python too; the einsums output
  # therefore pins it by version only, so it stays one build for every Python. The Python package
  # is to move to an einsums-waggle-python output of its own, which pins this one exactly.
  - name: einsums-waggle
    version: {{ waggle_version }}
    script: build-waggle.sh
    build:
      entry_points:
        - waggle = waggle.cli:main
      run_exports:
        - {{ pin_subpackage('einsums-waggle', max_pin='x') }}

    requirements:
      build:
        - {{ stdlib("c") }}
        - {{ compiler("cxx") }}
        - cmake >=3.27
        - ninja
        - python                                                               # [build_platform != target_platform]
        - cross-python_{{ target_platform }}                                   # [build_platform != target_platform]
        - pybind11                                                             # [build_platform != target_platform]
      host:
        - python
        - pybind11
        - pybind11-abi
        - fmt
        - apiary >=1.3.1,<2  # the codegen tool, which waggle._core's bindings are generated with
      run:
        - python
        # The viewer needs textual; the report and diff commands do not, and the viewer says how
        # to install it when it is missing.

    test:
      requires:
        - {{ compiler("cxx") }}
        - {{ stdlib("c") }}
        - cmake >=3.27
        - ninja
      files:
        - find-package/
      imports:
        - waggle
        - waggle._core
      commands:
        - test -f $PREFIX/lib/libwaggle$SHLIB_EXT
        - test -f $PREFIX/include/Waggle/Waggle.h
        - test -f $PREFIX/lib/cmake/Waggle/WaggleConfig.cmake
        - test -f $SP_DIR/waggle/_core*.so
        # Nothing of the Python package outside site-packages
        - test ! -d $PREFIX/lib/waggle
        - waggle --help
        - python -c "import waggle; assert waggle.__version__ == '{{ waggle_version }}', waggle.__version__"
        - otool -L $SP_DIR/waggle/_core*.so                                    # [osx]
        - ldd -v $SP_DIR/waggle/_core*.so                                      # [linux and build_platform == target_platform]
        - cmake -S find-package -B find-waggle -G Ninja ${CMAKE_ARGS} -D CMAKE_PREFIX_PATH=$PREFIX -D PACKAGE=Waggle -D VERSION={{ waggle_version }} -D TARGET=Waggle::waggle

  - name: einsums
    script: build-cxx.sh
    build:
      # Einsums breaks ABI between minor versions; the library file carries the ABI generation
      # (libEinsums-abi<N>), so consumers are pinned to the minor series.
      run_exports:
        - {{ pin_subpackage('einsums', max_pin='x.x') }}
      # Catch2 is here only for the suite the build runs; libEinsums does not link it.
      ignore_run_exports_from:
        - catch2

    requirements:
      build:
        - {{ stdlib("c") }}
        - {{ compiler("c") }}
        - {{ compiler("cxx") }}
        - cmake >=3.27
        - ninja
        - pkg-config
      host:
        - hdf5
        - libblas
        - libcblas
        - liblapack
        - llvm-openmp                            # [osx]
        - libgomp                                # [linux]
        - fftw
        - fmt
        - spdlog
        - cpptrace
        - mimalloc >=3.3,<3.7,!=3.4.0,!=3.4.1
        - apiary-annotations >=1.3.1,<2  # the APIARY_* macros only; the C++ build generates no code
        - einsums-stripes {{ stripes_version }}
        - einsums-waggle {{ waggle_version }}
        - catch2
      run:
        # EinsumsConfig.cmake finds these for every consumer, so they are needed at run time even
        # where nothing links them (Stripes' headers, Apiary's annotation contract).
        - apiary-annotations >=1.3.1,<2
        - einsums-stripes
        - einsums-waggle

    test:
      requires:
        - {{ compiler("cxx") }}
        - {{ stdlib("c") }}
        - cmake >=3.27
        - ninja
        - pkg-config
      files:
        - consumer/
      commands:
        # Libraries: shared only, named by ABI generation
        - test -f $PREFIX/lib/libEinsums-abi1$SHLIB_EXT
        - test ! -f $PREFIX/lib/libEinsums-abi1.a
        # Headers and package config
        - test -f $PREFIX/include/Einsums/Tensor.hpp
        - test -f $PREFIX/include/Einsums/ComputeGraph.hpp
        - test -f $PREFIX/share/cmake/Einsums/EinsumsConfig.cmake
        - test -f $PREFIX/share/cmake/Einsums/EinsumsTargets.cmake
        # Nothing that belongs to another package
        - test ! -d $PREFIX/lib/einsums
        - test ! -e $PREFIX/lib/libspdlog.a
        - test ! -e $PREFIX/lib/libstripes.a
        # Inspect linkage
        - ldd -v $PREFIX/lib/libEinsums-abi1$SHLIB_EXT                         # [linux]
        - otool -L $PREFIX/lib/libEinsums-abi1$SHLIB_EXT                       # [osx]
        # A downstream project finds, builds and runs against the installed package
        - cmake -S consumer -B consumer-build -G Ninja ${CMAKE_ARGS} -D CMAKE_PREFIX_PATH=$PREFIX
        - cmake --build consumer-build
        - ./consumer-build/consumer --einsums:debug:no-attach-debugger         # [build_platform == target_platform]

  - name: pyeinsums
    script: build-py.sh
    build:
      ignore_run_exports_from:
        - libblas
        - libcblas
        - liblapack
        - fftw
        # cpptrace's run export stays: on osx-64 libcpptrace exports libc++ typeinfo as weak
        # definitions, and the module binds to them there.
        - catch2

    requirements:
      build:
        - {{ stdlib("c") }}
        - {{ compiler("c") }}
        - {{ compiler("cxx") }}
        - cmake >=3.27
        - ninja
        - pkg-config
        - python                                                              # [build_platform != target_platform]
        - cross-python_{{ target_platform }}                                   # [build_platform != target_platform]
        - numpy                                                                # [build_platform != target_platform]
        - pybind11                                                             # [build_platform != target_platform]
      host:
        - python
        - pybind11
        - pybind11-abi
        - numpy
        - llvm-openmp                                                          # [osx]
        - libgomp                                                              # [linux]
        # to rebuild the c++ lib
        - hdf5
        - libblas
        - libcblas
        - liblapack
        - fftw
        - fmt
        - spdlog
        - cpptrace
        - mimalloc >=3.3,<3.7,!=3.4.0,!=3.4.1
        - apiary >=1.3.1,<2  # the codegen tool, which the bindings are generated with
        - einsums-stripes {{ stripes_version }}
        - einsums-waggle {{ waggle_version }}
        - {{ pin_subpackage('einsums', exact=True) }}
        # Einsums' configure sets Catch2 up even with its tests off; nothing here links it.
        - catch2
      run:
        - {{ pin_subpackage('einsums', exact=True) }}
        - python
        # einsums.profile and the einsums command import waggle's Python package
        - einsums-waggle

    test:
      # The Python tests live beside each module's sources and are not installed; run them from the
      # source tree against the installed package. The root conftest.py holds the shared fixtures
      # (dtype, the seeding), the tests import helper modules beside them, two promote scripts from
      # a module's examples, and the IR mutation tests read saved graphs.
      source_files:
        - pytest.ini
        - conftest.py
        - libs/Einsums/*/tests/unit/*.py
        - libs/Einsums/*/tests/unit/goldens/*
        - libs/Einsums/*/examples/*.py
      files:
        - import_all.py
      requires:
        - pytest
        - pytest-xdist
        - hypothesis >=6
        - scipy
        # The profiler viewer's graph summary is rich markup.
        - rich
      imports:
        - einsums
        - einsums._core
      commands:
        - test -f $SP_DIR/einsums/_core*.so
        - test ! -e $PREFIX/share/apiary
        - einsums --help
        - otool -L $SP_DIR/einsums/_core*.so                                   # [osx]
        - ldd -v $SP_DIR/einsums/_core*.so                                     # [linux and build_platform == target_platform]
        - python import_all.py
        # What the suite checks is the C++ library, which is the same build under every Python, so
        # the whole of it runs on one. The others run every module's tests but ComputeGraph's, and
        # the ComputeGraph files that cover the bindings, capture and replay: what differs between
        # Pythons is the extension module and the pure-Python package.
        # test_stage_module_python.py loads probe extension modules that only a build tree compiles,
        # and it fails rather than skips when they are missing.
        - pytest -rws --color yes --durations 10 -n auto libs --ignore=libs/Einsums/Python/tests/unit/test_stage_module_python.py  # [build_platform == target_platform and py == 314]
        - pytest -rws --color yes -n auto libs --ignore=libs/Einsums/Python/tests/unit/test_stage_module_python.py --ignore=libs/Einsums/ComputeGraph libs/Einsums/ComputeGraph/tests/unit/test_binding_reachability_python.py libs/Einsums/ComputeGraph/tests/unit/test_capture_python.py libs/Einsums/ComputeGraph/tests/unit/test_executor_python.py libs/Einsums/ComputeGraph/tests/unit/test_graph_python.py  # [build_platform == target_platform and py != 314]

about:
  home: https://github.com/Einsums/Einsums
  dev_url: https://github.com/Einsums/Einsums
  doc_url: https://einsums.github.io/Einsums
  license: MIT AND BSD-3-Clause
  license_url: https://opensource.org/license/mit/
  license_file:
    - LICENSE.txt
    - THIRD-PARTY-LICENSES.txt
  license_family: MIT
  summary: "J. Turney's C++ library providing compile-time contraction pattern analysis to determine optimal tensor operations"

extra:
  feedstock-name: einsums
  recipe-maintainers:
    - cgbriggs99
    - loriab
    - jturney
